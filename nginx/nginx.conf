# Куда передавать запросы: сервис web внутри сети compose, порт 8000
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Все запросы — в Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статику отдаём напрямую из общего тома (туда её кладёт collectstatic)
    location /static/ {
        alias /app/static/;
    }
}